name: PR Agent
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Force comparison against target PR base branch
          PR_REQUESTER.TARGET_BRANCH: ${{ github.base_ref }}

          config.model: "gemini/gemini-2.5-flash-lite"
          config.custom_model_max_tokens: 32000
          config.fallback_models: '["gemini/gemini-2.5-flash-lite", "gemini/gemini-2.5-flash", "anthropic/claude-haiku-4-5-20251001"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          # Custom review instructions
          pr_reviewer.extra_instructions: "Focus on the code added, Typescript best practices, variable naming and code quality and bugs. Check for proper error handling. Ignore Auth implementation security and only mention bugs. Ignore workflow changes."
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "true"
